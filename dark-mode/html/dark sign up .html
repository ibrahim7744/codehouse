      <!-- ----------------Form Begins--------------------------- -->
      <div class="signin">
        <div class="container-signin">
          <div class="heading">Sign Up</div>
          <form class="form" action="">
            <input
              placeholder="First Name "
              id="firstname"
              name="firstname"
              type="firstname"
              class="input"
              required=""
            />
            <span class="error"></span>

            <input
              placeholder="last Name"
              id="lastname"
              name="lastname"
              type="text"
              class="input"
              required=""
            />
            <span class="error"></span>

            <!-- <input
              placeholder="Phone"
              id="Phone"
              name="Phone"
              type="text"
              class="input"
              required=""
            />
            <span class="error"></span> -->


            <input
              placeholder="E-mail"
              id="email"
              name="email"
              type="text"
              class="input"
              required=""
            />
            <span class="error"></span>

            <input
              placeholder="Password"
              id="password"
              name="password"
              type="password"
              class="input"
              required=""
            />
            <span class="error"></span>

            <input
              placeholder="Confirm Password"
              id="Confirm_password"
              name="Confirm_password"
              type="password"
              class="input"
              required=""
            />
            <span class="error"></span>
            <input value="Sign Up" type="submit" class="login-button" />
          </form>
          <!-- ---------- Form End ----------------------- -->
          <div class="social-account-container">
            <span class="title"><a href="../../index.html#signin">Or sign in ?</a></span>
